<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1000 Songs - Standalone Post Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .hidden { display: none !important; }
        .custom-file-upload { display: inline-block; padding: 12px 24px; cursor: pointer; background-color: #000; color: #fff; border-radius: 8px; font-weight: bold; text-align: center; width: 100%; transition: transform 0.1s; }
        .custom-file-upload:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-900">

    <div class="max-w-xl mx-auto">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">1000 SONGS</h1>
            <p class="text-gray-500 text-sm uppercase tracking-widest font-bold">// Standalone Post Extractor</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <p class="text-sm text-gray-600 mb-4">Select your master <strong>blog.html</strong> file to parse the artists and generate standalone, SEO-optimized files for GitHub hosting.</p>
            <label class="custom-file-upload">
                <input type="file" id="fileInput" accept=".html" onchange="handleFile(event)">
                Select blog.html
            </label>
        </div>

        <div id="resultsArea" class="hidden">
            <div class="flex justify-between items-end mb-4 border-b border-gray-200 pb-2">
                <h2 class="text-xl font-bold">Extracted Posts</h2>
                <span id="postCount" class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded"></span>
            </div>
            <div id="postsList" class="space-y-4 pb-12">
                <!-- Parsed posts will appear here -->
            </div>
        </div>
    </div>

    <script>
        // CSS Template to be injected into every generated file
        const CSS_CONTENT = `
        :root { --bg: #ffffff; --text: #000000; --subtle: #666666; --line: #eeeeee; --accent: #0066ff; --accent-light: rgba(0, 102, 255, 0.06); --font: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --text: #ffffff; --subtle: #a0a0a0; --line: #222222; --accent-light: rgba(0, 102, 255, 0.15); } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; -webkit-font-smoothing: antialiased; padding-bottom: 4rem; }
        
        /* Dedicated Navigation Header */
        .site-header { padding: 1.5rem 5%; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 100; }
        .site-brand { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; text-decoration: none; color: var(--text); display: flex; align-items: baseline; gap: 10px; }
        .journal-badge { font-family: "Courier New", Courier, monospace; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; color: var(--accent); letter-spacing: 0.1em; }
        .back-link { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text); text-decoration: none; border: 1px solid var(--text); padding: 6px 12px; border-radius: 2px; transition: all 0.2s; }
        .back-link:hover { color: var(--accent); border-color: var(--accent); }
        
        /* Container */
        main { max-width: 800px; margin: 4rem auto 0; padding: 0 5%; }
        
        /* Article Styles from original */
        .post-article { width: 100%; }
        .post-header { margin-bottom: 2.5rem; }
        .post-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.15; margin-bottom: 1rem; }
        .blog-date { font-family: "Courier New", Courier, monospace; font-size: 0.8rem; color: var(--subtle); }
        .blog-category-tag { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--subtle); padding: 2px 6px; border: 1px solid var(--line); border-radius: 2px; }
        .article-id-badge { font-family: "Courier New", Courier, monospace; font-size: 0.65rem; color: var(--accent); background-color: var(--accent-light); padding: 3px 8px; border-radius: 4px; border: 1px dashed rgba(0, 102, 255, 0.4); display: inline-flex; align-items: center; text-transform: uppercase; font-weight: bold; }
        .post-meta-strip { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .artist-mentions-strip { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--line); width: 100%; }
        .artist-mentions-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--subtle); font-weight: 700; }
        .artist-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; color: var(--text); background-color: var(--line); padding: 2px 8px; border-radius: 4px; text-decoration: none; transition: all 0.2s ease; border: 1px solid transparent; }
        .artist-tag:hover { background-color: var(--accent-light); color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
        .artist-tag svg { opacity: 0.6; color: var(--accent); }
        .post-body { font-size: 1.15rem; line-height: 1.8; color: var(--text); }
        .post-body p { margin-bottom: 2rem; }
        .post-body h2 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; margin: 3rem 0 1.5rem 0; }
        .post-body h3 { font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem 0; }
        .post-body blockquote { font-family: "Courier New", Courier, monospace; font-size: 0.95rem; color: var(--text); margin: 2.5rem 0; padding-left: 1.5rem; border-left: 2px solid var(--accent); opacity: 0.9; letter-spacing: 0.02em; line-height: 1.6; }
        .post-body ul, .post-body ol { margin: 1.5rem 0 2.5rem 2rem; }
        .post-body li { margin-bottom: 0.75rem; }
        .blog-play-btn { display: inline-flex; align-items: center; justify-content: center; width: 1.2em; height: 1.2em; background-color: var(--accent-light); color: var(--accent); border: 1px solid rgba(0, 102, 255, 0.15); border-radius: 4px; margin: 0 0.25em; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); vertical-align: middle; transform: translateY(-0.08em); position: relative; padding: 0; }
        .blog-play-btn:hover { background-color: var(--accent); color: #ffffff; border-color: var(--accent); transform: translateY(-0.08em) scale(1.08); }
        .blog-play-btn svg { width: 0.65em; height: 0.65em; pointer-events: none; }
        .blog-play-btn.playing { background-color: var(--accent); color: #ffffff; border-color: var(--accent); }
        .blog-play-btn.loading svg { animation: spin 0.8s linear infinite; }
        .sonic-link { color: var(--text); text-decoration: none; border-bottom: 1.5px dashed var(--accent); padding-bottom: 1px; font-weight: 500; }
        .sonic-link:hover { color: var(--accent); border-bottom-style: solid; background-color: var(--accent-light); }
        .artist-link { color: var(--text); text-decoration: none; border-bottom: 1.5px solid var(--accent); padding-bottom: 1px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
        .artist-link:hover { color: var(--accent); background-color: var(--accent-light); }
        .article-references { margin-top: 4rem; padding-top: 2rem; border-top: 1px dashed var(--line); background-color: var(--accent-light); padding: 2rem; border-radius: 4px; }
        .article-references h4 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; margin-bottom: 1rem; }
        .article-references ul { list-style: none; margin: 0; padding: 0; }
        .article-references li { font-size: 0.95rem; color: var(--subtle); margin-bottom: 0.75rem; padding-left: 1.25rem; position: relative; }
        .article-references li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
        .article-references a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); }
        .article-references a:hover { color: var(--accent); border-color: var(--accent); }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .post-title { font-size: 2rem; } }
        `;

        // JavaScript to be injected into every generated file
        const JS_CONTENT = `
        let currentAudio = null;
        let currentButton = null;
        const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        const SPIN_SVG = '<svg viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="5"><circle cx="25" cy="25" r="20" stroke-dasharray="80 150" stroke-dashoffset="0"></circle></svg>';

        window.onload = function() {
            document.querySelectorAll('.blog-play-btn').forEach(btn => btn.innerHTML = PLAY_SVG);
        };

        async function playInline(el) {
            const artist = el.getAttribute('data-artist');
            const track = el.getAttribute('data-track');

            if (currentAudio && currentButton === el) {
                if (!currentAudio.paused) {
                    currentAudio.pause();
                    el.classList.remove('playing');
                    el.innerHTML = PLAY_SVG;
                } else {
                    currentAudio.play();
                    el.classList.add('playing');
                    el.innerHTML = PAUSE_SVG;
                }
                return;
            }

            stopPreview();

            el.classList.add('loading');
            el.innerHTML = SPIN_SVG;
            currentButton = el;

            const query = encodeURIComponent(artist + " " + track);
            try {
                const response = await fetch('https://itunes.apple.com/search?term=' + query + '&entity=song&limit=1');
                const data = await response.json();

                if (currentButton !== el) return;
                el.classList.remove('loading');

                if (data.results && data.results.length > 0 && data.results[0].previewUrl) {
                    currentAudio = new Audio(data.results[0].previewUrl);
                    currentAudio.play();
                    el.classList.add('playing');
                    el.innerHTML = PAUSE_SVG;

                    currentAudio.onended = () => {
                        el.classList.remove('playing');
                        el.innerHTML = PLAY_SVG;
                        currentAudio = null;
                        currentButton = null;
                    };
                } else {
                    el.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                    el.style.borderColor = "rgb(239, 68, 68)";
                    el.style.color = "rgb(239, 68, 68)";
                    el.innerHTML = PLAY_SVG;
                    setTimeout(() => {
                        el.style.backgroundColor = "";
                        el.style.borderColor = "";
                        el.style.color = "";
                    }, 1000);
                    currentButton = null;
                }
            } catch (error) {
                console.error("iTunes lookup error: ", error);
                el.classList.remove('loading');
                el.innerHTML = PLAY_SVG;
                currentButton = null;
            }
        }

        function stopPreview() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if (currentButton) {
                currentButton.classList.remove('playing', 'loading');
                currentButton.innerHTML = PLAY_SVG;
                currentButton = null;
            }
        }
        `;

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const htmlStr = e.target.result;
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlStr, "text/html");
                const articles = doc.querySelectorAll('.post-article');
                
                processArticles(articles);
            };
            reader.readAsText(file);
        }

        function cleanText(text) {
            if (!text) return "";
            return text.replace(/\s+/g, ' ').trim().replace(/"/g, '&quot;');
        }

        function processArticles(articles) {
            const listArea = document.getElementById('postsList');
            const countArea = document.getElementById('postCount');
            const resultsArea = document.getElementById('resultsArea');
            
            listArea.innerHTML = '';
            countArea.innerText = `${articles.length} posts found`;
            resultsArea.classList.remove('hidden');

            articles.forEach((article, index) => {
                const id = article.id || `post-${index}`;
                const filename = `${id}.html`;
                
                // Extract Meta Info for SEO
                const titleEl = article.querySelector('.post-title');
                const rawTitle = titleEl ? titleEl.textContent.trim() : 'Unknown Artist';
                const seoTitle = `${rawTitle} - Alternative Music Review & Deep Dive | 1000 Songs`;
                
                const dateEl = article.querySelector('.blog-date');
                const pubDate = dateEl ? new Date(dateEl.textContent).toISOString() : new Date().toISOString();

                // Generate Meta Description from the first actual paragraph
                let descText = `Read our deep dive into ${rawTitle}, exploring their impact on 100 years of alternative music. Part of the 1000 Songs archive.`;
                const paragraphs = article.querySelectorAll('.post-body p');
                for (let p of paragraphs) {
                    if (p.textContent.trim().length > 30) {
                        descText = p.textContent.trim().substring(0, 155) + '...';
                        break;
                    }
                }

                // Canonical URL
                const canonicalURL = `https://www.1000songs.co.uk/blog/${filename}`;
                
                // Remove the in-page copy ID badge logic in the generated static file to avoid confusion
                const clone = article.cloneNode(true);
                const badge = clone.querySelector('.article-id-badge');
                if (badge) badge.remove();
                
                // Remove hyperlink from the title
                const titleLink = clone.querySelector('.post-title a');
                if (titleLink) {
                    titleLink.outerHTML = titleLink.innerHTML;
                }

                // Build Schema.org
                const schemaGraph = {
                    "@context": "https://schema.org",
                    "@type": "BlogPosting",
                    "headline": seoTitle,
                    "description": descText,
                    "datePublished": pubDate,
                    "author": { "@type": "Person", "name": "Josh" },
                    "publisher": { "@type": "Organization", "name": "1000 Songs", "url": "https://www.1000songs.co.uk" },
                    "mainEntityOfPage": { "@type": "WebPage", "@id": canonicalURL }
                };

                // Construct full HTML
                let htmlOutput = '<!DOCTYPE html>\n<html lang="en">\n<head>\n';
                htmlOutput += '    <meta charset="UTF-8">\n';
                htmlOutput += '    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
                htmlOutput += `    <title>${seoTitle}</title>\n`;
                htmlOutput += `    <meta name="description" content="${cleanText(descText)}">\n`;
                htmlOutput += `    <link rel="canonical" href="${canonicalURL}">\n`;
                
                // Google Tag (gtag.js) Analytics Tracker
                htmlOutput += '    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BMRR0XZXPN"><\/script>\n';
                htmlOutput += '    <script>\n';
                htmlOutput += '      window.dataLayer = window.dataLayer || [];\n';
                htmlOutput += '      function gtag(){dataLayer.push(arguments);}\n';
                htmlOutput += '      gtag("js", new Date());\n';
                htmlOutput += '      gtag("config", "G-BMRR0XZXPN");\n';
                htmlOutput += '    <\/script>\n';

                htmlOutput += `    <style>${CSS_CONTENT}</style>\n`;
                htmlOutput += `    <script type="application/ld+json">\n${JSON.stringify(schemaGraph, null, 2)}\n    <\/script>\n`;
                htmlOutput += '</head>\n<body>\n';
                
                // Navigation / Header
                htmlOutput += '    <header class="site-header">\n';
                htmlOutput += '        <a href="https://www.1000songs.co.uk/blog.html" class="site-brand">\n';
                htmlOutput += '            1000 SONGS. <span class="journal-badge">// JOURNAL</span>\n';
                htmlOutput += '        </a>\n';
                htmlOutput += '        <a href="https://www.1000songs.co.uk/blog.html" class="back-link">← Back to Index</a>\n';
                htmlOutput += '    </header>\n';
                
                // Main Article Body
                htmlOutput += '    <main>\n';
                htmlOutput += `        ${clone.outerHTML}\n`;
                htmlOutput += '    </main>\n';
                
                htmlOutput += '    <footer style="margin-top: 80px; padding: 40px 0; text-align: center; border-top: 1px solid var(--line);">\n';
                htmlOutput += '        <a href="https://www.1000songs.co.uk/" style="color: var(--subtle); text-decoration: none; font-size: 0.7rem; letter-spacing: 0.05em; opacity: 0.5;">1000 SONGS MAIN ARCHIVE</a>\n';
                htmlOutput += '    </footer>\n';
                
                htmlOutput += `    <script>${JS_CONTENT}<\/script>\n`;
                htmlOutput += '</body>\n</html>';

                // Create Blob and UI Element
                const blob = new Blob([htmlOutput], { type: 'text/html' });
                const url = URL.createObjectURL(blob);

                const card = document.createElement('div');
                card.className = "p-4 bg-white border border-gray-100 shadow-sm rounded-xl flex items-center justify-between gap-4";
                
                card.innerHTML = `
                    <div class="truncate">
                        <h3 class="font-bold text-gray-900 truncate">${rawTitle}</h3>
                        <p class="text-xs text-gray-500 font-mono mt-1">/${filename}</p>
                    </div>
                    <a href="${url}" download="${filename}" class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-4 rounded-lg shadow transition-colors active:scale-95 inline-flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download
                    </a>
                `;
                
                listArea.appendChild(card);
            });
        }
    </script>
</body>
</html>
